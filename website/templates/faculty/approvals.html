{% extends "faculty/base.html" %}

{% block content %}
    <!-- Page Header -->
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold text-slate-800 dark:text-slate-100">Pending Approvals</h1>
    </div>

    <!-- Data Table -->
    <div class="bg-white/70 dark:bg-white/10 backdrop-blur-lg border border-slate-200/50 dark:border-white/10 rounded-xl shadow-lg">
        <div class="p-4 border-b border-slate-200/80 dark:border-white/10">
            <h2 class="text-lg font-semibold text-slate-800 dark:text-white">New Faculty Registrations</h2>
        </div>

        <div class="overflow-x-auto">
            <table class="w-full">
                <thead>
                    <tr class="text-left text-xs font-medium text-slate-500 dark:text-slate-400 uppercase tracking-wider">
                        <th class="px-6 py-3">Name</th>
                        <th class="px-6 py-3">Email</th>
                        <th class="px-6 py-3 text-right">Actions</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-200/80 dark:divide-white/10">
                    <!-- Loop through each pending user -->
                    {% for user in pending_list %}
                    <tr class="hover:bg-black/5 dark:hover:bg-white/5 transition-colors">
                        <td class="px-6 py-4 whitespace-nowrap">
                            <span class="text-sm font-medium text-slate-800 dark:text-white">{{ user.full_name }}</span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-500 dark:text-slate-400">
                            {{ user.email }}
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                            <!-- Form that submits a POST request to the approve route -->
                            <form action="{{ url_for('faculty_main.approve_faculty', user_id=user.id) }}" method="post">
                                <button type="submit" class="bg-green-500 text-white px-3 py-1 rounded-lg text-xs font-semibold hover:bg-green-600 transition-colors">
                                    Approve
                                </button>
                            </form>
                        </td>
                    </tr>
                    {% else %}
                    <tr>
                        <td colspan="3" class="text-center py-6 text-slate-500 dark:text-slate-400">No pending approvals.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
{% endblock %}
