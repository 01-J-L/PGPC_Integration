<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Maintenance</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
            color: #E2E8F0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            text-align: center;
            max-width: 600px;
            background: rgba(30, 41, 59, 0.8);
            padding: 50px 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }
        .icon {
            font-size: 64px;
            margin-bottom: 20px;
            animation: spin 3s linear infinite;
            display: inline-block;
        }
        h1 {
            font-size: 32px;
            margin-bottom: 12px;
            color: #6366F1;
        }
        p {
            font-size: 16px;
            line-height: 1.7;
            color: #94A3B8;
            margin-bottom: 24px;
        }
        .badge {
            display: inline-block;
            padding: 8px 18px;
            background: #334155;
            border-radius: 999px;
            font-size: 14px;
            color: #CBD5E1;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">&#9881;</div>
        <h1>System Maintenance</h1>
        <p>
            The grading system is currently undergoing scheduled maintenance.<br>
            All services are temporarily unavailable.<br><br>
            Please check back again shortly. We apologize for the inconvenience.
        </p>
        <span class="badge">PGPC Grading System &mdash; Under Maintenance</span>
    </div>
</body>
</html>
