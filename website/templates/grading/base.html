<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - College Grading System</title>
    
    <!-- Include Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Optional: Include a modern font from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
      /* Simple style to apply the Inter font */
      body {
        font-family: 'Inter', sans-serif;
      }
    </style>
</head>
<body class="bg-gray-100">
    
    <!-- START: ADD THIS CODE BLOCK -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div style="position: absolute; top: 1.25rem; right: 1.25rem; z-index: 50;">
          {% for category, message in messages %}
            <div class="px-4 py-3 mb-2 rounded-lg text-white {{ 'bg-red-500' if category == 'danger' else 'bg-green-500' }}" role="alert">
              <span>{{ message }}</span>
            </div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}
    <!-- END: ADD THIS CODE BLOCK -->

    {% block content %}{% endblock %}
</body>
</html>
