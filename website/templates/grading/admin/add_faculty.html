{% extends "faculty/base.html" %}
{% block content %}
    <div class="flex justify-between items-center mb-6">
        <div>
            <h1 class="text-3xl font-bold text-gray-800">Add New Faculty Member</h1>
            <p class="text-gray-600">Create a new, pre-approved faculty account.</p>
        </div>
        <a href="{{ url_for('faculty_main.grading_admin_faculty_records') }}" class="px-4 py-2 bg-gray-600 hover:bg-gray-700 text-white font-medium rounded-md shadow-sm transition-colors">
            &larr; Back to Faculty List
        </a>
    </div>

    <div class="bg-white p-8 rounded-lg shadow-md max-w-2xl mx-auto">
        <form method="POST" action="" class="space-y-6">
            
            <div>
                <label class="block text-sm font-medium text-gray-700">Full Name</label>
                <div class="mt-1">
                    <input type="text" name="name" required class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Email</label>
                <div class="mt-1">
                    <input type="email" name="email" required class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
                </div>
            </div>

            <div class="p-4 bg-gray-50 rounded-md border border-gray-200 space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide">Faculty Type</label>
                    <select name="faculty_type" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm" onchange="toggleProgramField()">
                        <option value="minor">Minor</option>
                        <option value="major">Major</option>
                    </select>
                </div>

                <div id="program-field" class="hidden">
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide">Program/Department</label>
                    <select name="program_id" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
                        <option value="">Select Program</option>
                        {% for program in programs %}
                        <option value="{{ program.program_id }}">{{ program.program_code }} - {{ program.title }}</option>
                        {% endfor %}
                    </select>
                    <p class="text-xs text-gray-500 mt-1">Select the department this faculty belongs to.</p>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Password</label>
                    <div class="mt-1">
                        <input type="password" name="password" required class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Confirm Password</label>
                    <div class="mt-1">
                        <input type="password" name="confirm_password" required class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm">
                    </div>
                </div>
            </div>

            <div class="pt-4">
                <button type="submit" class="w-full flex justify-center py-3 px-4 border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 cursor-pointer">Create Faculty Account</button>
            </div>
        </form>
    </div>

    <script>
        function toggleProgramField() {
            var typeSelect = document.getElementById("faculty_type");
            var programDiv = document.getElementById("program-field");
            
            if (typeSelect.value === "major") {
                programDiv.classList.remove("hidden");
            } else {
                programDiv.classList.add("hidden");
            }
        }
    </script>
{% endblock content %}
