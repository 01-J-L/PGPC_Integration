{% extends "faculty/base.html" %}
{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
        <div class="px-6 py-4 border-b border-gray-200 bg-gray-50 flex justify-between items-center">
            <h2 class="text-lg font-bold text-gray-900">Add New Program</h2>
            <a href="{{ url_for('faculty_main.grading_manage_programs') }}" class="text-sm text-gray-500 hover:text-gray-900">Cancel</a>
        </div>
        <div class="p-6">
            <form method="POST" class="space-y-6">
                <div>
                    <label for="program_code" class="block text-sm font-medium text-gray-700">Program Code</label>
                    <input type="text" id="program_code" name="code" required
                           class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm"
                           placeholder="e.g. BSCS">
                </div>
                <div>
                    <label for="program_name" class="block text-sm font-medium text-gray-700">Program Name</label>
                    <input type="text" id="program_name" name="name" required
                           class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm"
                           placeholder="e.g. Bachelor of Science in Computer Science">
                </div>
                <div class="pt-2">
                    <button type="submit"
                            class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 cursor-pointer">
                        Add Program
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock content %}
