<script>
    // --- LIVE DATA SYNC: refresh open finance pages when the database changes ---
    (function () {
        const POLL_MS = 5000;
        const VERSION_URL = "{{ url_for('auth.live_data_version') }}";
        let lastVersion = null;
        let reloading = false;
        let formDirty = false;

        document.addEventListener('input', function () { formDirty = true; }, true);
        document.addEventListener('change', function () { formDirty = true; }, true);

        function isBusy() {
            const el = document.activeElement;
            const editing = el && ['INPUT', 'SELECT', 'TEXTAREA'].includes(el.tagName);
            return formDirty || editing;
        }

        function showBanner() {
            if (document.getElementById('liveUpdateBanner')) return;
            const bar = document.createElement('div');
            bar.id = 'liveUpdateBanner';
            bar.style.cssText = 'position:fixed;right:16px;bottom:16px;z-index:9999;display:flex;align-items:center;gap:12px;background:#4f46e5;color:#fff;padding:12px 16px;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-family:Inter,sans-serif;font-size:14px;';
            bar.innerHTML = '<span>New data is available.</span><button id="liveUpdateBtn" style="background:#fff;color:#4f46e5;border:0;border-radius:6px;padding:6px 10px;font-weight:600;cursor:pointer;">Refresh now</button>';
            document.body.appendChild(bar);
            document.getElementById('liveUpdateBtn').addEventListener('click', function () {
                window.location.reload();
            });
        }

        async function poll() {
            if (reloading || document.hidden) return;
            try {
                const res = await fetch(VERSION_URL, { cache: 'no-store' });
                if (!res.ok) return;
                const data = await res.json();
                if (lastVersion === null) {
                    lastVersion = data.version;
                    return;
                }
                if (data.version !== lastVersion) {
                    lastVersion = data.version;
                    if (isBusy()) {
                        showBanner();
                    } else {
                        reloading = true;
                        window.location.reload();
                    }
                }
            } catch (e) {
                // Ignore transient network errors; next poll will retry.
            }
        }

        setInterval(poll, POLL_MS);
        document.addEventListener('visibilitychange', function () {
            if (!document.hidden) poll();
        });
    })();
</script>
